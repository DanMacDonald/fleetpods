[workspace]
resolver = "2"
members = [".", "xtask"]

[package]
name = "fleetpods"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Linux daemon that moves one paired AirPods accessory between a person's computers"
readme = "README.md"
publish = false

[[bin]]
name = "fleetpodsd"
path = "src/bin/fleetpodsd.rs"

[[bin]]
name = "fleetpods"
path = "src/bin/fleetpods.rs"

[features]
# Acceptance scenarios. Off by default so `cargo test` stays the unit suite.
accept = []

[dependencies]
dbus = "0.9"
libpulse-binding = "2.28"
libpulse-sys = "1.23"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
spake2 = "=0.4.0"
zeroize = { version = "1.8", features = ["derive"] }
aes = { version = "0.8", default-features = false }
[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "accept"
path = "tests/accept.rs"
required-features = ["accept"]

[profile.release]
lto = "thin"
codegen-units = 1
